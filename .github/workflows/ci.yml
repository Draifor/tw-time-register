name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lockfile:
    name: Lockfile in sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # Fails fast when a dependency was added to package.json without updating
      # pnpm-lock.yaml. --ignore-scripts keeps the check cheap: the lockfile is
      # validated during resolution, before any lifecycle script runs.
      - name: Verify the lockfile is in sync
        run: pnpm install --frozen-lockfile --ignore-scripts
