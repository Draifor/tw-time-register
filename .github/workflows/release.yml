name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # Required to upload release assets with electron-builder

jobs:
  build-windows:
    runs-on: windows-2022
    env:
      # Electron 42+ no longer downloads its binary from postinstall; it downloads
      # on the first use of the `electron` bin. The retry budget must therefore be
      # available for the whole job, not only for the install step.
      ELECTRON_GET_MAX_RETRIES: '5'
      # electron-builder requires a flat (hoisted) node_modules. pnpm reads
      # node-linker from the environment, so .npmrc is never rewritten.
      npm_config_node_linker: hoisted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Get pnpm store path
        id: pnpm-cache
        shell: pwsh
        run: echo "STORE_PATH=$(pnpm store path)" >> $env:GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\electron\Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Cache electron-builder binaries
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-builder-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-electron-builder-

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build (Vite + Electron)
        run: pnpm build

      # A tag push publishes to installed clients.
      - name: Package and publish
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec electron-builder --win --publish always

      # A manual dispatch only proves the pipeline: build, upload an artifact, never publish.
      - name: Package without publishing
        if: github.event_name == 'workflow_dispatch'
        run: pnpm exec electron-builder --win --publish never

      - name: Upload installer artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: tw-time-register-windows
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
