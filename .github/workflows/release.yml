name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # Required to upload release assets with electron-builder

jobs:
  build-windows:
    runs-on: windows-2022
    env:
      # Electron 42+ no longer downloads its binary from postinstall; it downloads
      # on the first use of the `electron` bin. The retry budget must therefore be
      # available for the whole job, not only for the install step.
      ELECTRON_GET_MAX_RETRIES: '5'
      # electron-builder requires a flat (hoisted) node_modules. pnpm reads
      # node-linker from the environment, so .npmrc is never rewritten.
      npm_config_node_linker: hoisted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Get pnpm store path
        id: pnpm-cache
        shell: pwsh
        run: echo "STORE_PATH=$(pnpm store path)" >> $env:GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\electron\Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Cache electron-builder binaries
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-builder-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-electron-builder-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (Vite + Electron)
        run: pnpm build

      # Pre-create the GitHub release for this tag so electron-builder only uploads into it.
      #
      # electron-builder's publisher cache is not atomic: the .exe.blockmap and the .exe are
      # queued as two concurrent artifact tasks, each can build its own GitHubPublisher, and
      # each calls createRelease. One POST wins and the other fails with 422 already_exists,
      # which aborts the publish and can leave the release incomplete (this happened on
      # v1.12.0, and skipped the gate below because the publish step failed first).
      #
      # GitHubPublisher.getOrCreateRelease reuses an existing release for the tag, so creating
      # it here - before electron-builder runs - makes both publishers find it and only upload.
      # Idempotent: a no-op when the release already exists (e.g. a workflow re-run).
      - name: Pre-create the GitHub release (tag push)
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/ensure-github-release.ps1 -Tag $env:GITHUB_REF_NAME

      # The gate is the `afterPack` hook registered in package.json: it runs the
      # packaged-native-module probe inside the build that produces the artifact.
      # A probe failure throws and aborts the build during the pack phase, before
      # any installer artifact exists, so nothing reaches installed clients. On a
      # tag push the published artifact is therefore the exact build the probe
      # inspected — there is no second, uninspected build.
      #
      # The two steps below are mutually exclusive by trigger: a tag push builds
      # and publishes in one pass; a manual dispatch builds without publishing.
      - name: Package and publish (tag push)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Upload into the tag's own release even once it is older than electron-builder's
          # 2-hour republish window, so a manual re-run actually republishes instead of
          # silently skipping. Asset collisions are handled by the publisher (delete + re-upload).
          EP_GH_IGNORE_TIME: 'true'
        run: pnpm exec electron-builder --win --publish always

      # The afterPack probe above certifies the packaged bytes; this gate
      # certifies the *release* those bytes were published to. electron-builder
      # can create two GitHub releases for a single tag because its publisher
      # cache is not atomic under the concurrently-queued blockmap and .exe
      # artifact tasks. The assets then split across the duplicate copies, and
      # GitHub resolves releases/download/<tag>/<asset> to only one of them, so
      # latest.yml and the installer can 404 even though the run is green.
      #
      # The gate asserts exactly one release per tag and fetches the three
      # updater URLs, failing on any non-200 or size mismatch. It is
      # deliberately cause-independent: it must catch a duplicate release
      # whatever produced it. It is read-only and never re-publishes, so it only
      # runs on a tag push (a manual dispatch publishes nothing).
      - name: Verify release assets (tag push)
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/verify-release-assets.ps1

      - name: Package (manual dispatch, no publish)
        if: github.event_name == 'workflow_dispatch'
        run: pnpm exec electron-builder --win --publish never

      - name: Upload installer artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: tw-time-register-windows
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
